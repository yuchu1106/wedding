<style>

.workspace{display:grid;grid-template-columns:minmax(300px,26vw) minmax(520px,1fr) minmax(300px,25vw);gap:10px;margin-top:10px}.panel{height:clamp(560px,calc(100vh - 225px),780px);overflow:hidden;display:flex;flex-direction:column}.panel-head{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:21px;border-bottom:1px solid #eee4dc}.columns,.guest{display:grid;align-items:center;grid-template-columns:32px 1.2fr .65fr .65fr .85fr .55fr;gap:4px;padding:0 14px}.columns{height:43px;color:#6f625b;font-size:13px;border-bottom:1px solid #eee}.guest{min-height:37px;border-bottom:1px solid #eee;font-size:14px}.guest:hover{background:#fbf4ee}.check{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green);font-size:11px}.unchecked .columns,.unchecked .guest{grid-template-columns:32px 1.2fr .65fr .75fr .75fr}.unchecked .guest{cursor:pointer}.unchecked .guest.selected{background:#faeadb}.guest.partial .check{background:var(--gold)}.box{width:20px;height:20px;border:1px solid #c9b8aa;border-radius:4px}.list{flex:1;min-height:0;overflow:auto}.viewall{display:none}.legend{min-height:66px;padding:12px 10px 18px;display:flex;justify-content:center;align-items:center;gap:24px;font-size:13px;background:#fff}.dot{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-2px}
.center{min-width:0}.map-card{padding:10px;background:#fdf9f4}.hall{width:100%;aspect-ratio:1.87/1;position:relative;border:2px solid #8e7a6b;background:#fcfaf6;overflow:hidden}.stage{position:absolute;left:6.4%;top:25.0%;width:11.2%;height:42.7%;background:#eee0d4;border-left:12px solid #a88975;display:grid;place-items:center;font-size:22px}.entrance{position:absolute;right:-1px;top:38.5%;height:31.2%;width:16px;background:#839394}.entrance-label{position:absolute;right:2.0%;top:29.0%;font-size:14px}.tables{position:absolute;inset:0}.table{position:absolute;transform:translate(-50%,-50%);width:8.0%;aspect-ratio:1;border-radius:50%;background:#eee2d7;border:1px solid #c8ab96;display:grid;place-items:center;font:18px Georgia,serif;transition:.2s}.table.main{width:9.5%;text-align:center;line-height:1.08}.table.main .main-number{font:18px Georgia,serif}.table.main .main-label{font-size:11px;font-family:inherit}.table.active{background:#f6e6cf;border-color:#e9a944;box-shadow:0 0 0 3px #fff,0 0 18px 8px rgba(244,187,82,.65)}
.form-card{margin-top:10px;min-height:270px;padding:14px 24px;display:none}.form-card.open{display:block}.form-title{display:flex;justify-content:space-between;font-size:20px;font-weight:600;border-bottom:1px solid #eee;padding-bottom:12px}.form-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;padding:12px 0}.attendance{display:flex;align-items:center;gap:15px}.counter{display:flex;align-items:center;gap:18px}.roundbtn{width:38px;height:38px;border:1px solid #d6c5b8;background:#fff;border-radius:50%;font-size:23px;color:#7d6758}.roundbtn.plus{background:#b5947d;color:#fff}.money-row{display:grid;grid-template-columns:1fr auto 1.4fr;gap:16px;align-items:end}.field label{display:block;margin-bottom:6px;font-size:14px}.field input{height:45px;width:100%;border:1px solid #d8cec6;border-radius:6px;padding:0 12px;background:#fff;color:#4a3024;-webkit-text-fill-color:#4a3024;caret-color:#4a3024}.field input::placeholder{color:#a99a90;opacity:1}.field input:disabled{background:#f2ece7;color:#9b8d84;-webkit-text-fill-color:#9b8d84;opacity:1}.nogift{height:45px;display:flex;align-items:center;gap:8px;white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1.7fr;gap:14px;margin-top:15px}.actions button{height:56px;border-radius:7px;border:1px solid #b3927b;background:#fff;color:#4a3024;font-size:17px}.actions .confirm{background:#a88670;color:white}.single-note{font-size:12px;color:#9b897d;margin-top:4px}.footer{display:flex;justify-content:space-between;color:#b49a88;font:12px Georgia,serif;letter-spacing:2px;padding:22px 20px 0}.upload-btn{height:34px;border:1px solid #cbb5a5;background:#fffaf6;color:#6f5445;border-radius:7px;padding:0 11px;font-size:13px}.panel-head-actions{display:flex;align-items:center;gap:8px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#4e392e;color:#fff;padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.brand,.quote{display:none}.topgrid{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.panel{height:420px}.center{order:-1}.map-card{height:430px}.unchecked{height:450px}.stats{grid-template-columns:repeat(3,1fr) auto}.page{padding:8px}.title h1{font-size:28px}}
@media(max-width:650px){.hero{height:72px}.title h1{font-size:22px;letter-spacing:1px}.title p{font-size:9px;letter-spacing:2px}.stats{height:auto;padding:12px;grid-template-columns:1fr 1fr}.stat{border-right:0;border-bottom:1px solid #eee;padding:8px}.export{margin:8px;grid-column:1/-1}.workspace{display:flex;flex-direction:column}.center{order:-2}.map-card{height:360px;overflow:auto}.hall{min-width:650px}.form-grid,.money-row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.panel{height:390px}.searchbox{height:78px;padding:14px}.searchbox .mag{top:29px}.search-results{top:68px}.brand{display:none}}

<body>
<div class="page">
<header class="hero"><div class="brand">Jay & Mona<small>OUR WEDDING DAY ♥</small></div><div class="title"><h1>2026/11/22　婚禮簽到</h1><p>WELCOME TO OUR WEDDING</p></div><div class="quote">有你們的到來<br>是我們最美好的禮物</div></header>
<section class="topgrid"><div class="stats"><div class="stat"><div class="icon">♟</div><div><span>已報到人數</span><strong><i id="checkedCount">0</i> / <i id="totalCount">0</i> 人</strong></div></div><div class="stat"><div class="ring" id="ring" style="--pct:0%"><b id="ringText">0%</b></div><div><span>報到率</span><strong id="rate">0%</strong></div></div><div class="stat"><div class="icon">♟</div><div><span>未報到人數</span><strong id="uncheckedCount">0 人</strong></div></div><div style="display:flex;gap:8px;align-items:center"><button class="export" id="exportBtn">⇧　匯出 Excel</button></div></div><div class="searchbox"><span class="mag">⌕</span><input id="search" placeholder="搜尋賓客姓名..." autocomplete="off"><div class="search-results" id="searchResults"></div></div></section>
<main class="workspace">
<section class="panel checked"><div class="panel-head"><span>♟ 已報到賓客（<b id="checkedGroups">0</b>）</span><span>›</span></div><div class="columns"><span></span><span>姓名</span><span>桌次</span><span>人數</span><span>禮金</span><span>備註</span></div><div class="list" id="checkedList"></div></section>
<section class="center"><div class="map-card"><div class="hall"><div class="stage">舞 台</div><div class="entrance"></div><div class="entrance-label">◀　入口</div><div class="tables" id="tables"></div></div></div><div class="form-card" id="formCard"><div class="form-title"><span id="selectedTitle">賓客</span><button onclick="closeForm()" style="border:0;background:none;font-size:20px">×</button></div><div class="form-grid"><div><div style="font-size:14px;color:#77675d">預計人數</div><div style="font-size:24px;margin-top:8px"><b id="expected">1</b> 人</div></div><div id="actualWrap"><div style="font-size:14px;color:#77675d">實際報到人數</div><div class="attendance"><div class="counter"><button class="roundbtn" onclick="changeActual(-1)">−</button><b id="actual" style="font-size:24px">1</b> 人<button class="roundbtn plus" onclick="changeActual(1)">＋</button></div></div><div class="single-note">預設為預計人數，只有實際到場人數不同時才需調整</div></div></div><div class="money-row"><div class="field"><label>禮金金額（元）</label><input id="gift" type="number" min="0" placeholder="請輸入金額"></div><label class="nogift"><input type="checkbox" id="noGift"> 無需禮金</label><div class="field"><label>備註（選填）</label><input id="note" placeholder="例如：朋友、公司同事、晚到..."></div></div><div class="actions"><button onclick="closeForm()">取消</button><button class="confirm" onclick="confirmCheckin()">確認報到</button></div></div></section>
<section class="panel unchecked"><div class="panel-head"><span>♟ 未報到賓客（<b id="uncheckedGroups">0</b>）</span><div class="panel-head-actions"><button class="upload-btn" id="uploadBtn">⇧ 上傳檔案</button><input id="uploadFile" type="file" accept=".csv,text/csv" hidden><span>›</span></div></div><div class="columns"><span></span><span>姓名</span><span>桌次</span><span>預計人數</span><span>狀態</span></div><div class="list" id="uncheckedList"></div><div class="legend"><span><i class="dot" style="background:var(--gray)"></i>未報到</span><span><i class="dot" style="background:var(--gold)"></i>部分報到</span><span><i class="dot" style="background:var(--green)"></i>已報到</span></div></section>
</main><div class="footer"><span>TWO HEARTS　ONE BEAUTIFUL DAY</span><span style="font-family:cursive;font-size:20px">Thank you for being here ♥</span></div></div><div class="toast" id="toast"></div>
<script>
const CLOUD_API='/api/checkin';
const seedGuests=[
{id:1,name:'王小美',table:3,expected:3},{id:2,name:'陳志明',table:4,expected:1},{id:3,name:'林家好',table:5,expected:1},{id:4,name:'黃俊傑',table:6,expected:2},{id:5,name:'劉品妍',table:8,expected:2},{id:6,name:'吳曼廷',table:9,expected:3},{id:7,name:'張雅筑',table:11,expected:1},{id:8,name:'李承翰',table:13,expected:2},{id:9,name:'蔡欣怡',table:14,expected:1},{id:10,name:'周子安',table:15,expected:2},{id:11,name:'洪瑞鵬',table:17,expected:1},{id:12,name:'許庭瑋',table:18,expected:1},{id:13,name:'邱詩芸',table:19,expected:2},{id:14,name:'賴建宏',table:20,expected:2},
{id:15,name:'王大明',table:1,expected:2,actual:2,gift:6000,note:'',checked:true},{id:16,name:'李小華',table:3,expected:3,actual:3,gift:3200,note:'',checked:true},{id:17,name:'陳美玲',table:5,expected:1,actual:1,noGift:true,note:'',checked:true},{id:18,name:'張家豪',table:7,expected:2,actual:2,gift:3600,note:'',checked:true},{id:19,name:'林宜靜',table:7,expected:1,actual:1,gift:3600,note:'同事',checked:true},{id:20,name:'黃子翔',table:8,expected:2,actual:2,gift:2000,note:'',checked:true},{id:21,name:'吳佩珊',table:10,expected:1,actual:1,noGift:true,note:'',checked:true},{id:22,name:'劉志強',table:12,expected:3,actual:3,gift:6600,note:'',checked:true},{id:23,name:'蔡依琳',table:15,expected:2,actual:2,gift:3200,note:'',checked:true},{id:24,name:'周杰倫',table:16,expected:4,actual:4,gift:12000,note:'朋友',checked:true},{id:25,name:'楊千霈',table:18,expected:2,actual:2,gift:2600,note:'',checked:true},{id:26,name:'許書豪',table:20,expected:1,actual:1,gift:3000,note:'',checked:true},{id:27,name:'鄭雅文',table:21,expected:2,actual:2,gift:3600,note:'',checked:true},{id:28,name:'何冠廷',table:22,expected:1,actual:1,noGift:true,note:'',checked:true}
];
function cloneSeed(){return JSON.parse(JSON.stringify(seedGuests))}
let guests=cloneSeed(), selected=null, actual=1, syncing=false;

async function apiRequest(body){
  const options=body
    ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}
    : {cache:'no-store'};
  const response=await fetch(CLOUD_API,options);
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'雲端同步失敗');
  return data;
}
async function loadCloudGuests(showError=false){
  if(syncing||selected)return;
  syncing=true;
  try{
    let data=await apiRequest();
    if(!Array.isArray(data.guests)||data.guests.length===0){
      data=await apiRequest({action:'init',guests:cloneSeed()});
    }
    if(Array.isArray(data.guests)){guests=data.guests;render()}
  }catch(err){
    console.error(err);
    if(showError)toast('雲端同步失敗，請稍後再試');
  }finally{syncing=false}
}
async function saveGuestCloud(guest){
  return apiRequest({action:'upsert',guest});
}
async function replaceAllCloud(nextGuests){
  return apiRequest({action:'replaceAll',guests:nextGuests});
}
const $=id=>document.getElementById(id);
const giftEl=$('gift'), noGiftEl=$('noGift'), noteEl=$('note'), formCardEl=$('formCard');
const positions=[1,2,4,6,8,10,11,3,5,7,9,14,16,18,20,22,12,13,15,17,19,21,23];
const tablePos={1:[25.0,48.5],2:[29.7,11.3],4:[41.9,11.3],6:[54.1,11.3],8:[66.2,11.3],10:[78.4,11.3],11:[90.6,11.3],3:[35.8,30.0],5:[48.0,30.0],7:[59.2,30.0],9:[71.2,30.0],14:[35.8,61.9],16:[47.6,61.9],18:[59.3,61.9],20:[71.4,61.9],22:[83.4,61.9],12:[18.4,81.3],13:[29.8,81.3],15:[41.8,81.3],17:[53.8,81.3],19:[66.0,81.3],21:[78.2,81.3],23:[90.3,81.3]};
function tableLabel(t){return t===1?'主桌':t+'桌'}
function renderTables(){const el=$('tables');el.innerHTML='';positions.forEach(n=>{const d=document.createElement('div');d.className='table'+(n===1?' main':'');d.dataset.table=n;d.innerHTML=n===1?'<span><span class="main-number">1</span><br><span class="main-label">主桌</span></span>':n;const [x,y]=tablePos[n];d.style.left=x+'%';d.style.top=y+'%';el.appendChild(d)})}
function render(){const checked=guests.filter(g=>g.checked),unchecked=guests.filter(g=>!g.checked);$('checkedList').innerHTML=checked.map(g=>{const partial=(g.actual||0)<g.expected;return `<div class="guest ${partial?'partial':''}" onclick="selectGuest(${g.id},true)"><span class="check">${partial?'◐':'✓'}</span><span>${g.name}</span><span>${tableLabel(g.table)}</span><span>${g.actual}/${g.expected}</span><span>${g.noGift?'無需禮金':Number(g.gift||0).toLocaleString()}</span><span>${g.note||'-'}</span></div>`}).join('');$('uncheckedList').innerHTML=unchecked.map(g=>`<div class="guest ${selected&&selected.id===g.id?'selected':''}" onclick="selectGuest(${g.id})"><span class="box"></span><span>${g.name}</span><span>${tableLabel(g.table)}</span><span>${g.expected}</span><span>未報到</span></div>`).join('');const total=guests.reduce((s,g)=>s+g.expected,0),arrived=checked.reduce((s,g)=>s+(g.actual||0),0),rate=total?Math.round(arrived/total*100):0;$('checkedCount').textContent=arrived;$('totalCount').textContent=total;$('uncheckedCount').textContent=(total-arrived)+' 人';$('checkedGroups').textContent=checked.length;$('uncheckedGroups').textContent=unchecked.length;$('rate').textContent=rate+'%';$('ringText').textContent=rate+'%';$('ring').style.setProperty('--pct',rate+'%')}
function selectGuest(id,view=false){selected=guests.find(g=>g.id===id);if(!selected)return;document.querySelectorAll('.table').forEach(t=>t.classList.toggle('active',Number(t.dataset.table)===selected.table));$('selectedTitle').textContent=`${selected.name}${selected.expected>1?'（含攜伴'+(selected.expected-1)+'位）':''} ・ ${tableLabel(selected.table)}`;$('expected').textContent=selected.expected;actual=selected.checked?(selected.actual||selected.expected):selected.expected;$('actual').textContent=actual;$('actualWrap').style.display=selected.expected===1?'none':'block';giftEl.value=(selected.gift??'') || '';noGiftEl.checked=!!selected.noGift;giftEl.disabled=noGiftEl.checked;noteEl.value=selected.note||'';formCardEl.classList.add('open');render();if(view)toast('已載入此賓客報到資料')}
function changeActual(v){if(!selected)return;actual=Math.max(0,Math.min(selected.expected,actual+v));$('actual').textContent=actual}
function closeForm(){formCardEl.classList.remove('open');selected=null;document.querySelectorAll('.table').forEach(t=>t.classList.remove('active'));giftEl.disabled=false;render()}
async function confirmCheckin(){
  if(!selected)return;
  const amount=giftEl.value.trim();
  if(!amount&&!noGiftEl.checked){
    toast('請輸入禮金金額，或勾選「無需禮金」');
    giftEl.disabled=false;
    giftEl.focus();
    return;
  }

  const target=guests.find(g=>g.id===selected.id);
  if(!target)return;

  const original=JSON.parse(JSON.stringify(target));
  target.checked=true;
  target.actual=target.expected===1?1:actual;
  target.gift=amount?Number(amount):0;
  target.noGift=noGiftEl.checked;
  target.note=noteEl.value.trim();

  const name=target.name;
  render();

  try{
    await saveGuestCloud(target);
    closeForm();
    toast(`${name} 已完成報到並同步到雲端`);
    setTimeout(()=>loadCloudGuests(),250);
  }catch(err){
    Object.assign(target,original);
    render();
    console.error(err);
    toast('報到儲存失敗，請再試一次');
  }
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
$('search').addEventListener('input',e=>{const q=e.target.value.trim(),r=$('searchResults');if(!q){r.style.display='none';return}const hits=guests.filter(g=>g.name.includes(q));r.innerHTML=hits.length?hits.map(g=>`<div onclick="selectGuest(${g.id});document.getElementById('search').value='';document.getElementById('searchResults').style.display='none'"><b>${g.name}</b>　${tableLabel(g.table)}　${g.checked?'已報到':'未報到'}</div>`).join(''):'<div>找不到符合的賓客</div>';r.style.display='block'});
noGiftEl.addEventListener('change',()=>{giftEl.disabled=noGiftEl.checked;if(noGiftEl.checked)giftEl.value='';else setTimeout(()=>giftEl.focus(),0)});
giftEl.addEventListener('input',()=>{if(giftEl.value){noGiftEl.checked=false;giftEl.disabled=false}});
$('exportBtn').addEventListener('click',()=>{const rows=[['姓名','桌次','預計人數','實到人數','狀態','禮金','無需禮金','備註'],...guests.map(g=>[g.name,tableLabel(g.table),g.expected,g.checked?(g.actual||g.expected):0,g.checked?'已報到':'未報到',g.gift||'',g.noGift?'是':'否',g.note||''])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='2026-11-22_婚禮簽到名單.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出，可使用 Excel 開啟')});
function parseCSV(text){
  const rows=[];let row=[],cell='',quote=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());cell='';if(row.some(v=>v!==''))rows.push(row);row=[]}else cell+=c}
  row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows;
}
function normalizeUploadedGuests(rows){if(!rows.length)throw new Error('檔案沒有資料');const header=rows[0].map(x=>x.replace(/^\uFEFF/,'').trim());const find=(names)=>header.findIndex(h=>names.includes(h));const ni=find(['姓名','賓客姓名','名字']),ti=find(['桌次','桌號','桌']),ei=find(['預計人數','人數','出席人數','總人數']);if(ni<0||ti<0)throw new Error('CSV 至少需要「姓名」與「桌次」欄位');return rows.slice(1).filter(r=>r[ni]?.trim()).map((r,i)=>{const rawTable=(r[ti]||'').replace(/[^0-9]/g,'');const table=Number(rawTable);const expected=ei>=0?Math.max(1,Number((r[ei]||'1').replace(/[^0-9]/g,''))||1):1;if(!table||table<1||table>23)throw new Error(`第 ${i+2} 列桌次無效：${r[ti]||''}`);return {id:i+1,name:r[ni].trim(),table,expected,checked:false,actual:0,gift:0,noGift:false,note:''}})}
$('uploadBtn').onclick=()=>$('uploadFile').click();
$('uploadFile').addEventListener('change',async e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file)return;
  if(!/\.csv$/i.test(file.name)){toast('目前請上傳 CSV 檔');return}
  try{
    const imported=normalizeUploadedGuests(parseCSV(await file.text()));
    if(!imported.length)throw new Error('沒有可匯入的賓客');
    if(!confirm(`將以 ${imported.length} 筆新賓客資料覆蓋目前全部名單，且全部設為未報到。確定上傳？`))return;
    await replaceAllCloud(imported);
    guests=imported;
    selected=null;
    formCardEl.classList.remove('open');
    render();
    toast(`已匯入 ${imported.length} 筆賓客並同步到所有裝置`);
  }catch(err){
    alert('上傳失敗：'+err.message);
  }
});
