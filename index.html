<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨電腦同步 Todo List</title>
  <style>
    :root{
      --bg:#f7f1ea;
      --paper:#fffdf9;
      --ink:#4a3024;
      --muted:#9a897e;
      --line:#e9ddd2;
      --tea:#aa8974;
      --tea-dark:#8c6c58;
      --tea-light:#e7d7ca;
      --shadow:0 18px 55px rgba(76,51,35,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 15% 0%,rgba(255,255,255,.95),transparent 38%),
        linear-gradient(135deg,#f8f3ed 0%,#f3ebe4 100%);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .app{
      width:min(760px,100%);
      background:rgba(255,253,249,.92);
      border:1px solid rgba(232,222,212,.9);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter:blur(10px);
    }
    .hero{
      padding:36px 36px 24px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(250,244,238,.55));
    }
    .eyebrow{
      margin:0 0 8px;
      font:600 12px/1.2 Georgia,serif;
      letter-spacing:3px;
      color:var(--tea);
      text-transform:uppercase;
    }
    h1{
      margin:0;
      font-family:Georgia,"Noto Serif TC",serif;
      font-weight:500;
      font-size:clamp(28px,5vw,42px);
      letter-spacing:.5px;
    }
    .sub{
      margin:10px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }
    .composer{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:24px 36px 18px;
    }
    .composer input{
      width:100%;
      height:54px;
      border:1px solid #dacbc0;
      border-radius:15px;
      background:#fff;
      color:var(--ink);
      padding:0 18px;
      font-size:16px;
      outline:none;
      transition:.18s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    }
    .composer input::placeholder{color:#b2a49a}
    .composer input:focus{
      border-color:var(--tea);
      box-shadow:0 0 0 4px rgba(170,137,116,.12);
    }
    .composer button{
      height:54px;
      border:0;
      border-radius:15px;
      padding:0 22px;
      color:white;
      background:linear-gradient(180deg,#b3937e,#9b7862);
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(140,108,88,.22);
      transition:.18s ease;
    }
    .composer button:hover{transform:translateY(-1px)}
    .composer button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 36px 16px;
      color:var(--muted);
      font-size:13px;
    }
    .sync{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#6d9b72;
      box-shadow:0 0 0 4px rgba(109,155,114,.12);
    }
    .refresh{
      border:0;
      background:none;
      color:var(--tea-dark);
      font-weight:700;
      cursor:pointer;
      padding:6px 0;
    }
    .list{
      padding:0 24px 28px;
      min-height:180px;
    }
    .todo{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin:10px 0;
      padding:18px 18px;
      background:white;
      border:1px solid #eee3da;
      border-radius:17px;
      box-shadow:0 7px 20px rgba(77,53,38,.05);
    }
    .bullet{
      width:13px;
      height:13px;
      border-radius:50%;
      margin-top:5px;
      flex:0 0 auto;
      background:var(--tea-light);
      border:3px solid #c6aa97;
    }
    .todo-main{min-width:0}
    .todo-text{
      font-size:16px;
      line-height:1.55;
      word-break:break-word;
    }
    .todo-time{
      margin-top:5px;
      color:#aa9b91;
      font-size:12px;
    }
    .empty,.error,.loading{
      text-align:center;
      padding:50px 20px;
      color:var(--muted);
    }
    .error{color:#a05f57}
    .footer{
      text-align:center;
      padding:16px 24px 24px;
      color:#b1a198;
      font:12px Georgia,serif;
      letter-spacing:2px;
    }
    @media(max-width:600px){
      body{padding:12px}
      .app{border-radius:22px}
      .hero{padding:28px 22px 20px}
      .composer{grid-template-columns:1fr;padding:20px 22px 14px}
      .composer button{width:100%}
      .meta{padding:0 22px 14px}
      .list{padding:0 14px 22px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">Shared Cloud Todo</p>
      <h1>跨電腦同步待辦事項</h1>
      <p class="sub">資料儲存在 Upstash Redis。只要開啟同一個 Vercel 網址，不同電腦與手機都會讀取同一份清單。</p>
    </section>

    <form class="composer" id="todoForm">
      <input id="todoInput" type="text" maxlength="200" placeholder="輸入新的待辦事項…" autocomplete="off" />
      <button id="addBtn" type="submit">＋ 新增待辦</button>
    </form>

    <div class="meta">
      <span class="sync"><i class="dot"></i><span id="syncText">準備同步</span></span>
      <button class="refresh" id="refreshBtn" type="button">重新整理</button>
    </div>

    <section class="list" id="todoList">
      <div class="loading">正在讀取雲端資料…</div>
    </section>

    <div class="footer">UPSTASH REDIS × VERCEL</div>
  </main>

  <script>
    const listEl = document.getElementById('todoList');
    const formEl = document.getElementById('todoForm');
    const inputEl = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const syncText = document.getElementById('syncText');

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatTime(value) {
      if (!value) return '';
      const date = new Date(value);
      return new Intl.DateTimeFormat('zh-TW', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    function renderTodos(todos) {
      if (!Array.isArray(todos) || todos.length === 0) {
        listEl.innerHTML = '<div class="empty">目前還沒有待辦事項 ✦</div>';
        return;
      }

      listEl.innerHTML = todos.map(todo => `
        <article class="todo">
          <span class="bullet"></span>
          <div class="todo-main">
            <div class="todo-text">${escapeHtml(todo.text)}</div>
            <div class="todo-time">${escapeHtml(formatTime(todo.createdAt))}</div>
          </div>
        </article>
      `).join('');
    }

    async function loadTodos() {
      syncText.textContent = '同步中…';
      try {
        const response = await fetch('/api/todo', { cache: 'no-store' });
        if (!response.ok) throw new Error('讀取失敗');
        const data = await response.json();
        renderTodos(data.todos || []);
        syncText.textContent = '已同步雲端資料';
      } catch (error) {
        console.error(error);
        listEl.innerHTML = '<div class="error">無法讀取雲端待辦事項，請稍後再試。</div>';
        syncText.textContent = '同步失敗';
      }
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = inputEl.value.trim();
      if (!text) {
        inputEl.focus();
        return;
      }

      addBtn.disabled = true;
      addBtn.textContent = '新增中…';
      syncText.textContent = '寫入雲端…';

      try {
        const response = await fetch('/api/todo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '新增失敗');

        inputEl.value = '';
        renderTodos(data.todos || []);
        syncText.textContent = '已同步雲端資料';
        inputEl.focus();
      } catch (error) {
        console.error(error);
        alert(error.message || '新增失敗，請稍後再試');
        syncText.textContent = '同步失敗';
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = '＋ 新增待辦';
      }
    });

    refreshBtn.addEventListener('click', loadTodos);
    loadTodos();
  </script>
</body>
</html>
